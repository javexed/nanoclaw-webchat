name: Compose

# The product gate: compose a full nanoclaw+webchat tree from this repo's
# app/patches against the pinned base + seam, run BOTH suites in the
# composed tree, and publish the composed tarball as the build artifact —
# the same artifact a release attaches for the Proxmox / deploy flows.

on:
  # No `branches:` filter on pull_request — deliberately. With `branches: [main]`
  # a PR whose BASE is another branch never triggers, so a stacked PR (one built
  # on the branch of an earlier, still-open PR) silently gets NO CI at all: no
  # leak gate, no compose, and a green-looking PR page because nothing ever ran.
  # Found when a stacked extraction PR sat with zero runs and no explanation.
  #
  # Stacking is the normal shape for this work — each UI module comes out on top
  # of the last — so the checks have to follow the PR, not the base branch.
  # push stays pinned to main: that is the post-merge run, and running it for
  # every branch push would double every job for no added signal.
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels that PR's stale run. A push to main never
# cancels another: each gets its own group (by commit), so every merge keeps
# a real verdict instead of a cancellation that some CI hosts report as a failure.
concurrency:
  group: compose-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      # Anonymous checkout: on some runners the per-job task token is refused
      # for repos under this owner. The repo is public, so fetch without
      # credentials rather than depending on token auth working.
      - name: checkout (anonymous)
        run: |
          echo "checkout (anonymous)" > "$RUNNER_TEMP/ci-step"
          git init -q .
          git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
          git fetch -q --depth 1 origin ${{ github.sha }}
          git checkout -q FETCH_HEAD
          # The image ships whatever Node it ships and the job does not pin it,
          # so record it: "which Node did CI run" has been guesswork.
          { echo "node $(node -v)"; echo "image $(cat /etc/os-release 2>/dev/null | sed -n 's/^PRETTY_NAME=//p')"; } \
            > "$RUNNER_TEMP/ci-env" 2>/dev/null || true
      # A pin to a seam the seam repo doesn't have fails every compose, and
      # used to surface five minutes in as "could not be fetched". This says so
      # in seconds, with the fix.
      - name: Seam pin is published
        env:
          NANOCLAW_WEBCHAT_SEAM_REPO: ${{ vars.NANOCLAW_SEAM_REPO }}
        run: |
          echo "Seam pin is published" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-seam-pin.sh

      # ── Scope ──────────────────────────────────────────────────────────────
      # What does this change touch? A PR that never goes near ui/ used to pay
      # ~5 minutes for Chromium and the browser probes, and every PR ran all of
      # upstream's host suite — two thirds of the files, already run by
      # upstream at the pinned ref. scripts/ci-scope.sh decides; it FAILS OPEN
      # (push events, no base, any error → run everything) and is exercised
      # locally exactly as here. The container gate below keeps its own rule.
      - name: Scope (what this change touches)
        id: scope
        run: |
          echo "Scope (what this change touches)" > "$RUNNER_TEMP/ci-step"
          bash scripts/ci-scope.sh "${{ github.event_name }}" "${{ github.base_ref }}" origin | tee -a "$GITHUB_OUTPUT"

      # No actions/setup-node here: it breaks on some Actions implementations,
      # and the runner image already ships a current Node.
      - uses: pnpm/action-setup@v4
        with:
          # This repo has no package.json for the action to infer from — the
          # composed TREE is what pnpm operates on. Keep in step with the
          # base's packageManager field, which is pnpm@10.34.5. It had drifted
          # to 10.33.0 against that very instruction, which is the argument for
          # check-version-drift.sh in the ops repo: an instruction in a comment
          # is not a check. .mise.toml now pins the same version for local
          # shells, so CI, the composed tree and a developer shell all agree.
          version: 10.34.5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      # ── Caches ────────────────────────────────────────────────────────────
      # Every job ran in a fresh container with nothing persisted, so each one
      # re-downloaded the pnpm store TWICE (ui + composed tree), the bun store,
      # and a ~150MB Chromium. That repetition was the bulk of a ~12 minute run.
      # The runner's own cache server is enabled, so actions/cache needs no
      # volume plumbing.
      #
      # Keys are lockfile-derived: a dependency change misses and repopulates,
      # everything else hits. restore-keys give a partial hit after a bump so a
      # single changed dep does not re-download the world.
      - name: Cache — pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('ui/pnpm-lock.yaml', 'versions.json') }}
          restore-keys: pnpm-

      - name: Cache — bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('versions.json') }}
          restore-keys: bun-

      # The pinned upstream base, as a bare mirror kept in the runner cache: the
      # clone from the upstream host was the slowest part of Compose. install.sh
      # takes the base repo from NANOCLAW_WEBCHAT_BASE_REPO, so a local path is a
      # drop-in. The pin is checked out exactly as before; a mirror that lacks
      # it is fetched (or re-cloned), never trusted.
      - name: Cache — upstream base mirror
        uses: actions/cache@v4
        with:
          path: ~/.cache/nanoclaw-base.git
          key: base-${{ hashFiles('versions.json') }}
          restore-keys: base-

      - name: Upstream base mirror (has the pinned ref)
        run: |
          echo "Upstream base mirror (has the pinned ref)" > "$RUNNER_TEMP/ci-step"
          REPO=$(python3 -c "import json;print(json.load(open('versions.json'))['nanoclaw']['upstreamRepo'])")
          REF=$(python3 -c "import json;print(json.load(open('versions.json'))['nanoclaw']['upstreamRef'])")
          M="$HOME/.cache/nanoclaw-base.git"
          if [ -d "$M" ] && git -C "$M" cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "mirror has ${REF:0:12}"
          elif [ -d "$M" ] && git -C "$M" fetch -q "$REPO" "+refs/heads/*:refs/heads/*" 2>/dev/null \
            && git -C "$M" cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "mirror updated to include ${REF:0:12}"
          else
            rm -rf "$M"; git clone -q --bare "$REPO" "$M"
            echo "mirror cloned"
          fi
          echo "NANOCLAW_WEBCHAT_BASE_REPO=$M" >> "$GITHUB_ENV"

      - name: Compose (clone base + seam, overlay, patch, register, build)
        env:
          # Where the seam is fetched from: the NANOCLAW_SEAM_REPO repository
          # variable if set (a fork's own seam repo), else versions.json's
          # seamRepo. No location is hardcoded here.
          #
          # Releases always compose from versions.json's seamRepo: release.sh
          # refuses a pin that is not reachable from its pub/module-hooks.
          NANOCLAW_WEBCHAT_SEAM_REPO: ${{ vars.NANOCLAW_SEAM_REPO }}
          SKIP_CONTAINER_BUILD: '1'
          # The runner image ships Node 24; .nvmrc pins 22. That combination is
          # proven here — it installs, passes install.sh's own better-sqlite3
          # native-binding verification, and runs both suites green. There is no
          # actions/setup-node to change it (broken on some runners) and no
          # mise in the image, so opt out of the .nvmrc major check explicitly.
          # The binding verification remains the real gate.
          NANOCLAW_ALLOW_NODE_MISMATCH: '1'
        run: |
          echo "Compose (clone base + seam, overlay, patch, register, build)" > "$RUNNER_TEMP/ci-step"
          bash install.sh --dir "$RUNNER_TEMP/composed"

      - name: Manifest guard self-test (proves it still detects faults)
        if: steps.scope.outputs.guards == 'true'
        # Runs against throwaway fixtures, never the repo's own tree. A guard
        # only ever seen to pass is not evidence.
        run: |
          echo "Manifest guard self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-manifest.selftest.sh

      - name: Manifest integrity (migrations register; dev tree matches)
        # Reference-free. Catches the silent one: a migration file with no
        # manifest entry ships into installs and never runs. This replaced the
        # fork-diff coverage guard when channels-webchat was decommissioned —
        # see docs/coverage-guards.md.
        run: |
          echo "Manifest integrity (migrations register; dev tree matches)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-manifest.sh

      - name: Patch header self-test (proves it still detects faults)
        if: steps.scope.outputs.guards == 'true'
        # Throwaway fixture patches, never the repo's own. A guard only ever seen
        # to pass is not evidence.
        run: |
          echo "Patch header self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-patch-headers.selftest.sh

      - name: Patch headers (a/ b/, no escape codes, names match paths)
        # A regenerated patch carries the regenerator's git diff config. c/ w/
        # headers are churn; a missing prefix or escape codes make install.sh's
        # git apply fail with an error that never says why.
        run: |
          echo "Patch headers (a/ b/, no escape codes, names match paths)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-patch-headers.sh

      - name: Subset selector self-test (proves it still refuses to under-select)
        if: steps.scope.outputs.guards == 'true'
        # Throwaway fixtures, never the repo's own tree. The failure that matters
        # for a test SELECTOR is quietly picking too little; this proves it maps
        # a changed file to its sibling tests and refuses an empty selection.
        run: |
          echo "Subset selector self-test (proves it still refuses to under-select)" > "$RUNNER_TEMP/ci-step"
          bash scripts/ci-host-test-subset.selftest.sh

      - name: Async self-test (proves it still detects faults)
        if: steps.scope.outputs.guards == 'true'
        run: |
          echo "Async self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-async.selftest.sh "$RUNNER_TEMP/composed"

      - name: Unused self-test (proves it still detects faults)
        if: steps.scope.outputs.guards == 'true'
        run: |
          echo "Unused self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-unused.selftest.sh "$RUNNER_TEMP/composed"

      - name: Owned code — format, async, unused (in parallel)
        # Three independent read-only checks over the same composed tree, each
        # scoped to the files and patch lines this repo owns:
        #   format  the composed tree carries upstream's format:fix pre-commit
        #           hook; a payload that is not already clean gets rewritten
        #           during a deploy commit and stops matching the artifact.
        #   async   a missed await on the async DB driver fails silently.
        #   unused  nothing else runs the unused-vars rule on our files.
        # Run together and reported apart: each log is printed under its own
        # name, and the step fails if any of them does.
        run: |
          echo "Owned code — format, async, unused (in parallel)" > "$RUNNER_TEMP/ci-step"
          C="$RUNNER_TEMP/composed"; L="$RUNNER_TEMP/owned-checks"; mkdir -p "$L"
          bash scripts/check-format.sh "$C" > "$L/format.log" 2>&1 & F=$!
          bash scripts/check-async.sh "$C" > "$L/async.log" 2>&1 & A=$!
          bash scripts/check-unused.sh "$C" > "$L/unused.log" 2>&1 & U=$!
          rc=0
          for c in format:$F async:$A unused:$U; do
            n=${c%%:*}; p=${c#*:}
            if wait "$p"; then r=ok; else r=FAILED; rc=1; fi
            echo "::group::$n — $r"; cat "$L/$n.log"; echo "::endgroup::"
            [ "$r" = ok ] || echo "::error::$n check failed (log above)"
          done
          exit $rc

      - name: Setup prompts self-test (proves it still detects faults)
        if: steps.scope.outputs.guards == 'true'
        run: |
          echo "Setup prompts self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-setup-prompts.selftest.sh "$RUNNER_TEMP/composed"

      - name: Setup prompts (headless installers cover upstream's questions)
        # The installers run setup:auto without a TTY; a question they cannot
        # answer cancels and setup exits 0 part-way. Fails on a new upstream
        # step or prompt until it has been reviewed (ci/setup-prompts.txt).
        run: |
          echo "Setup prompts (headless installers cover upstream's questions)" > "$RUNNER_TEMP/ci-step"
          node scripts/check-setup-prompts.mjs "$RUNNER_TEMP/composed"

      - name: Host tests (composed tree)
        working-directory: ${{ runner.temp }}/composed
        # GITHUB_TOKEN is no longer cleared here. Actions runners export one
        # into every job, and verify()'s `has()` reads process.env before the
        # install's own env, so an ambient token invented a github channel and
        # failed five tests in setup/verify-slack.test.ts. Clearing it was a
        # workaround for this CI only; the real fix now rides in
        # patches/upstreamable/setup__verify{,-slack.test}.ts.patch, so every
        # install gets it and a developer with `gh` in their shell stops
        # hitting it too. Both patches DELETE when upstream merges the PR they
        # carry. Proven: with an ambient GITHUB_TOKEN the patched tree passes
        # 18/18 where an unpatched one fails exactly those five.
        # vitest's 5s default is tuned for a developer machine. These suites do
        # real SQLite file IO (journal_mode=DELETE is load-bearing for
        # cross-mount visibility), and inside a contended runner container the
        # same tests that pass in ~2.5-4s locally cross 5s and time out — 22 of
        # them in one observed run, every failure a timeout and not one a failed
        # assertion. Raising the ceiling here (this workflow is fork-owned, so
        # it needs no patch against upstream) removes the false red without
        # weakening a single assertion.
        run: |
          echo "Host tests (composed tree)" > "$RUNNER_TEMP/ci-step"

          # Run the suite as an unprivileged user, as the seam's own CI does.
          # Upstream forces failures with chmod (0o555 folders it cannot delete,
          # 0o000 files it cannot read), and root ignores permission bits, so as
          # root those tests watch the "failure" succeed and go red. It is a class
          # upstream keeps adding to (four more in scripts/update/ at once), so
          # patching each test to be uid-independent does not keep up; a non-root
          # run lets every one of them run as written. Locally the suite already
          # runs as an ordinary user, so this also makes CI match a developer.
          AS=()
          if [ "$(id -u)" = 0 ]; then
            id ci >/dev/null 2>&1 || useradd -m -u 1001 ci
            chown -R ci:ci .
            # pnpm/action-setup (and any other root-installed tool) lives under
            # root's home, which is 700. Let other users TRAVERSE it, not list
            # it, so ci runs the very same toolchain; the job container is
            # discarded afterwards.
            chmod o+x "$HOME"
            : > "$RUNNER_TEMP/host-tests.log"
            chown ci:ci "$RUNNER_TEMP/host-tests.log"
            # -E keeps the job's env (TMPDIR, NODE_OPTIONS); PATH is passed
            # explicitly because sudo's secure_path would drop the toolchain.
            AS=(sudo -u ci -H -E env PATH="$PATH")
          fi

          # Node 26 deprecates `module.register()` (DEP0205). Upstream's lockfile
          # pins tsx 4.21.0, which calls it, so on such a Node every
          # `node --import tsx` spawn prints the warning to stderr — and three
          # upstream CLI tests (src/cli/stdin-json{,.e2e}.test.ts) assert stderr
          # is exactly empty or exactly one line, and fail.
          #
          # NOT what is red today: these runners ship Node 24, where DEP0205 does
          # not exist. This is forward insurance only, for the day the image moves
          # — the job pins no Node, so that day arrives without warning.
          #
          # PROBED, not assumed: --disable-warning does not exist before Node
          # 21.3, where passing it would make every node invocation fail and turn
          # a warning into a much worse red. Set it only if this Node takes it.
          #
          # DELETE once the composed tree resolves tsx >= 4.23.13, which no longer
          # calls module.register(). Verified both ways: 4.21.0 warns, 4.23.13 is
          # silent.
          if node --disable-warning=DEP0205 -e '' 2>/dev/null; then
            export NODE_OPTIONS="--disable-warning=DEP0205${NODE_OPTIONS:+ $NODE_OPTIONS}"
          fi

          # Tee to a file the failure reporter can quote. Some CI hosts serve no
          # log API and no artifacts, so an un-captured failure is
          # a failure nobody can read: three separate investigations have ended
          # in inference because the only signal was a step name.
          set -o pipefail
          # full: every test in the composed tree. subset: this repo's own tests
          # plus upstream tests for the files the seam, a patch, or an app/
          # overwrite changes — see scripts/ci-host-test-subset.sh. The selector
          # refuses to pick nothing, and its self-test ran just above.
          if [ "${{ steps.scope.outputs.host }}" = "subset" ]; then
            bash "$GITHUB_WORKSPACE/scripts/ci-host-test-subset.sh" "$GITHUB_WORKSPACE" . > "$RUNNER_TEMP/host-tests.files"
            echo "::notice::Host tests: SUBSET — $(wc -l < "$RUNNER_TEMP/host-tests.files") files (this repo's tests + upstream tests for the files it changes). The full suite runs when versions.json, patches/, install.sh, scripts/ or the workflow change, and on every push to main."
            "${AS[@]}" bash "$GITHUB_WORKSPACE/scripts/ci-run-host-tests.sh" "$RUNNER_TEMP/host-tests.log" "$RUNNER_TEMP/host-tests.files"
          else
            "${AS[@]}" bash "$GITHUB_WORKSPACE/scripts/ci-run-host-tests.sh" "$RUNNER_TEMP/host-tests.log"
          fi

      # Does this change reach the container tree at all? A CSS-only PR ran the
      # full bun suite for nothing — real minutes on a serial runner.
      #
      # FAILS OPEN on purpose: push events, a missing base, an unresolvable
      # merge-base, or any error all answer "yes, run it". The only way to skip
      # is to positively prove the diff misses every path that can affect the
      # container. Skipping on uncertainty would trade minutes for the chance of
      # landing an untested runner change.
      #
      # patches/ and versions.json count: the container tree is upstream code at
      # a pinned ref plus patches, so either can change what gets tested without
      # container/ itself appearing in the diff.
      - name: Does this touch the container tree?
        id: touched
        run: |
          echo "Does this touch the container tree?" > "$RUNNER_TEMP/ci-step"
          set -uo pipefail
          decide() { echo "container=$1" >> "$GITHUB_OUTPUT"; echo "container tests: $1"; exit 0; }
          [ "${{ github.event_name }}" = "pull_request" ] || decide true
          BASE_REF="${{ github.base_ref }}"
          [ -n "$BASE_REF" ] || decide true
          git fetch -q --depth 50 origin "$BASE_REF" 2>/dev/null || decide true
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          # Same defect the scope step had: the checkout is --depth 1, so HEAD
          # has no ancestry and merge-base always failed → this gate had never
          # actually skipped a run. Deepen HEAD too.
          git fetch -q --depth 50 origin "$(git rev-parse HEAD)" 2>/dev/null || decide true
          MB=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null) || decide true
          [ -n "$MB" ] || decide true
          CHANGED=$(git diff --name-only "$MB"..HEAD 2>/dev/null) || decide true
          if printf '%s\n' "$CHANGED" | grep -qE '^(container/|app/container/|app/provider-overlays/|patches/|versions\.json)'; then
            decide true
          fi
          decide false

      - name: Container typecheck + tests (composed tree)
        if: steps.touched.outputs.container == 'true'
        working-directory: ${{ runner.temp }}/composed/container/agent-runner
        run: |
          echo "Container typecheck + tests (composed tree)" > "$RUNNER_TEMP/ci-step"
          # Plain install (not --frozen-lockfile): the composed tree carries
          # upstream's bun.lock while the app tree adds runner sources; the
          # proven local compose flow installs the same way.
          bun install
          bun run typecheck
          bun test

      - name: Say what this run skipped
        # A green run that silently did less is the kind of silence that gets
        # mistaken for coverage later. Name it.
        if: steps.scope.outputs.guards != 'true' || steps.scope.outputs.runner != 'true'
        run: |
          echo "Say what this run skipped" > "$RUNNER_TEMP/ci-step"
          if [ "${{ steps.scope.outputs.guards }}" != "true" ]; then
            echo "::notice::Guard SELF-TESTS skipped — this change touches no guard, probe, fixture, baseline or workflow. Every guard itself ran; the proofs that they still catch their faults run when a guard changes and on every push to main."
          fi
          if [ "${{ steps.scope.outputs.runner }}" != "true" ]; then
            echo "::notice::VS Code runner skill check skipped — this change touches neither the skill, the webchat server it plugs into, nor how the tree is composed."
          fi

      - name: Pack composed tarball
        run: |
          echo "Pack composed tarball" > "$RUNNER_TEMP/ci-step"
          cd "$RUNNER_TEMP"
          # Ship sources, not installs: node_modules re-materialize from the
          # lockfile on the target; .git stays out of release artifacts.
          tar --exclude='./composed/node_modules' \
              --exclude='./composed/container/agent-runner/node_modules' \
              --exclude='./composed/.git' \
              -czf nanoclaw-webchat-composed.tar.gz ./composed
          ls -lh nanoclaw-webchat-composed.tar.gz

      # Two Actions implementations need DIFFERENT major versions here, and no
      # single version satisfies both:
      #
      #   GitHub          hard-blocks v3 (deprecated April 2024). A run using it
      #                   fails at admission, before any step executes.
      #   Other runners   may implement only the v3 artifact protocol. v4 needs
      #                   ACTIONS_RESULTS_URL; without it the action dies with
      #                   `TypeError: Invalid URL … input: '/api/v1'`.
      #
      # `uses:` cannot take an expression, so the choice has to be `if:` across
      # two steps. Keep their inputs in step with each other.
      # ONE upload step, v4. The previous split (v4 for GitHub, v3 for the
      # the other runner) auto-failed every GitHub run: GitHub resolves EVERY
      # action referenced in the workflow during "Set up job", BEFORE any `if:`
      # is evaluated, so the skipped v3 step still tripped the deprecation block
      # ("This request has been automatically failed because it uses a
      # deprecated version of actions/upload-artifact: v3"). A condition cannot
      # hide a deprecated action from that check — the reference has to go.
      - name: Upload composed tarball
        # GitHub only. `actions/artifact` v2+ — which upload-artifact@v4 depends
        # on — refuses to run against a GHES-style API, and a self-hosted
        # runner commonly presents as exactly that. It does not degrade; it fails the job:
        #   GHESNotSupportedError: @actions/artifact v2.0.0+, upload-artifact@v4+
        #   and download-artifact@v4+ are not currently supported on GHES.
        #
        # v3 is not the escape hatch it looks like. GitHub resolves EVERY action
        # referenced by the workflow during "Set up job", BEFORE any `if:` is
        # evaluated, and hard-blocks deprecated ones — so merely NAMING v3
        # auto-fails every GitHub run, even in a step that would be skipped. The
        # earlier two-step v4/v3 split died on precisely that. The reference
        # itself is the problem, so there can only be one upload step, at v4,
        # and it has to be the runner that opts out rather than the version.
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: nanoclaw-webchat-composed
          path: ${{ runner.temp }}/nanoclaw-webchat-composed.tar.gz
          retention-days: 14

      - name: Artifact upload skipped (unsupported on this runner)
        # Say it out loud. Everything above — compose, both suites, the guards —
        # ran in full; only retention is skipped. A job that quietly produces no
        # artifact while reporting green is the kind of silence that gets
        # mistaken for coverage later.
        if: github.server_url != 'https://github.com'
        run: |
          echo "Artifact upload skipped (unsupported on this runner)" > "$RUNNER_TEMP/ci-step"
          echo "::notice::Composed tarball was built, packed and verified, but NOT uploaded."
          echo "::notice::upload-artifact@v4 needs actions/artifact v2+, which refuses GHES-style APIs."
          echo "::notice::Every gate above ran; artifact retention is a GitHub-only convenience."


      # ── Make a failure readable without opening the web UI ──────────────────
      #
      # WHY. Artifacts do not work on this runner (see the upload step above),
      # the per-job and per-log API routes 404 on this instance, and the web log
      # route will not take token auth. So for anyone working through the API a
      # red compose has been a status and a duration and nothing else.
      #
      # That is not a theoretical gap. Failures here cluster at two durations,
      # and one of those clusters was read as infrastructure flake for hours
      # while it was actually a new guard crashing with ENOENT — visible in the
      # step log the whole time, which nobody could fetch. Naming the step turns
      # "compose is red again" into "go read this one step".
      #
      # Each run step writes its own name to $RUNNER_TEMP/ci-step as its first
      # line, so this reports the last step to START — which is the one that
      # died. `uses:` steps (the setup and cache actions) are not instrumented,
      # so a failure inside one of those reports the previous run step; the
      # wording below says "at or after" rather than pretending otherwise.
      - name: VS Code runner skill (applies, builds, its tests pass)
        if: steps.scope.outputs.runner == 'true'
        # The runner ships as a skill (app/.claude/skills/add-vscode-runner), so
        # the host tests above ran without it. Install it the way an operator
        # would and run its own validation. After the tarball is packed: the
        # shipped tree stays without it.
        working-directory: ${{ runner.temp }}/composed
        run: |
          echo "VS Code runner skill (applies, builds, its tests pass)" > "$RUNNER_TEMP/ci-step"
          pnpm exec tsx - <<'TS'
          import { applySkill, fullyApplied } from './scripts/skill-apply.js';
          import { execSync } from 'node:child_process';
          const res = await applySkill('.claude/skills/add-vscode-runner', process.cwd(), {
            exec: (c) => execSync(c, { stdio: 'inherit' }),
            emit: () => {},
          });
          if (!fullyApplied(res)) {
            console.error('add-vscode-runner did not fully apply', res);
            process.exit(1);
          }
          TS
          # Its code is ours: hold it to the same no-dropped-Promise gate, now
          # that it sits at its installed paths.
          bash "$GITHUB_WORKSPACE/scripts/check-async.sh" "$RUNNER_TEMP/composed"
          bash "$GITHUB_WORKSPACE/scripts/check-unused.sh" "$RUNNER_TEMP/composed"

      - name: Name the failing step in a PR comment
        if: failure() && github.event_name == 'pull_request'
        # Never let the reporter change the build's verdict: the job has already
        # failed and this only adds information.
        continue-on-error: true
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-report-failure.sh compose

  # The UI phase as its own job: it builds and probes ui/ and the committed
  # bundle, and needs nothing from the composed tree, so it runs beside compose
  # instead of in front of it. Skipped steps cost nothing when a change does not
  # touch the UI (the scope step decides, the same way as in compose).
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: checkout (anonymous)
        run: |
          echo "checkout (anonymous)" > "$RUNNER_TEMP/ci-step"
          git init -q .
          git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
          git fetch -q --depth 1 origin ${{ github.sha }}
          git checkout -q FETCH_HEAD
          { echo "node $(node -v)"; echo "image $(cat /etc/os-release 2>/dev/null | sed -n 's/^PRETTY_NAME=//p')"; } \
            > "$RUNNER_TEMP/ci-env" 2>/dev/null || true

      - name: Scope (what this change touches)
        id: scope
        run: |
          echo "Scope (what this change touches)" > "$RUNNER_TEMP/ci-step"
          bash scripts/ci-scope.sh "${{ github.event_name }}" "${{ github.base_ref }}" origin | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.ui == 'true'
        with:
          version: 10.34.5

      - name: Cache — pnpm store
        if: steps.scope.outputs.ui == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('ui/pnpm-lock.yaml', 'versions.json') }}
          restore-keys: pnpm-

      # The single biggest item: the browser binary. Keyed on the playwright
      # version in the lockfile so a bump repopulates rather than silently
      # running an old browser against new bindings.
      - name: Cache — Playwright browsers
        if: steps.scope.outputs.ui == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: playwright-

      # ── UI bundle ────────────────────────────────────────────────────────
      # app/public/webchat/app.js is BUILT from ui/ and committed. Rebuild it
      # here and fail if the result differs from what the PR carries: that
      # catches both a hand-edit of the generated bundle and a source change
      # pushed without rebuilding. Runs before compose, since compose copies
      # app/ into the composed tree.
      - name: UI — install
        if: steps.scope.outputs.ui == 'true'
        run: |
          echo "UI — install" > "$RUNNER_TEMP/ci-step"
          pnpm --dir ui install --frozen-lockfile

      - name: UI — typecheck
        if: steps.scope.outputs.ui == 'true'
        run: |
          echo "UI — typecheck" > "$RUNNER_TEMP/ci-step"
          pnpm --dir ui run typecheck

      - name: UI — unit tests (pure logic — decisions, derivations, formatting)
        if: steps.scope.outputs.ui == 'true'
        # Node, not a browser: what needs the DOM is the browser probes' job
        # below. Seconds, so a logic slip fails here before any Chromium starts.
        run: |
          echo "UI — unit tests (pure logic — decisions, derivations, formatting)" > "$RUNNER_TEMP/ci-step"
          pnpm --dir ui run test

      - name: UI — shadowed-ref guard self-test (proves it still detects faults)
        if: steps.scope.outputs.ui == 'true'
        run: |
          echo "UI — shadowed-ref guard self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          node ui/check-shadowed-refs.mjs --selftest

      - name: UI — busy-label guard self-test (proves it still detects faults)
        if: steps.scope.outputs.ui == 'true'
        run: |
          echo "UI — busy-label guard self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          node ui/check-busy-labels.mjs --selftest

      - name: UI — every wait is on its control
        if: steps.scope.outputs.ui == 'true'
        # DESIGN.md "Long-running operations": a wait is the pressed control's
        # spinner (buttonBusy / BusyLabel). A bare "Saving…" label, a template
        # ternary to one, or an "Uploading…" toast fails here; a 2026-10 sweep
        # removed 45 of them.
        run: |
          echo "UI — every wait is on its control" > "$RUNNER_TEMP/ci-step"
          node ui/check-busy-labels.mjs

      - name: UI — no parameter shadows an imported ref
        if: steps.scope.outputs.ui == 'true'
        # renderMembers(members) shadowed the imported `members` ref, so the
        # assignment landed on the argument and the island that reads the ref
        # never updated: the room reported "1 member" and listed nobody. tsc,
        # check-refs and the browser guards were all silent — the identifier IS
        # defined, just not the one meant.
        run: |
          echo "UI — no parameter shadows an imported ref" > "$RUNNER_TEMP/ci-step"
          node ui/check-shadowed-refs.mjs

      - name: UI — reference integrity (extracted modules define what they use)
        if: steps.scope.outputs.ui == 'true'
        # Narrow on purpose: TS2304 only. The modules carved out of legacy.js are
        # still plain JS with checkJs off, so the compiler is otherwise silent
        # about them — including about the one failure mode extraction actually
        # produces, a function moved out while the variable it reads stays behind.
        # That bundles fine, builds fine, passes e2e, and throws ReferenceError on
        # the first run of the path. It reached main once already (`lucide`,
        # unimported in features/voice.js).
        run: |
          echo "UI — reference integrity (extracted modules define what they use)" > "$RUNNER_TEMP/ci-step"
          pnpm --dir ui run check:refs

      - name: UI — injected dependencies are all supplied
        if: steps.scope.outputs.ui == 'true'
        # Complements the reference check. A `deps.X` that legacy never supplies
        # is `undefined` at runtime and throws only when that path executes —
        # typecheck, check:refs and the build are all silent about it, and e2e
        # only catches it if a test happens to walk there. A cleanup pass that
        # dropped a spread from one provide*Deps call emptied it completely and
        # every static gate still passed.
        run: |
          echo "UI — injected dependencies are all supplied" > "$RUNNER_TEMP/ci-step"
          pnpm --dir ui run check:deps

      - name: UI — mounted components get their required props
        if: steps.scope.outputs.ui == 'true'
        # The same failure shape as check:deps, at the other seam. Vue types the
        # createApp props argument as a bare index signature, so vue-tsc compares
        # it against nothing: a required prop that is never passed is `undefined`
        # and throws only when that path runs. RoomList shipped to production
        # without `activityOf` — its sort comparator — so the sidebar rendered
        # empty for every authenticated user while every gate here stayed green.
        run: |
          echo "UI — mounted components get their required props" > "$RUNNER_TEMP/ci-step"
          pnpm --dir ui run check:props

      - name: UI — build
        if: steps.scope.outputs.ui == 'true'
        run: |
          echo "UI — build" > "$RUNNER_TEMP/ci-step"
          pnpm --dir ui run build

      - name: UI — install Chromium (boot-order guard)
        if: steps.scope.outputs.ui == 'true'
        run: |
          echo "UI — install Chromium (boot-order guard)" > "$RUNNER_TEMP/ci-step"
          # The browser comes from the Playwright cache above. Its Linux
          # libraries may already be on the runner (a prepared image or host —
          # ci/image, or `playwright install-deps` run there once). Probe with a
          # headless launch; install them (apt) only if Chromium cannot start.
          pnpm --dir ui exec playwright install chromium
          if (cd ui && node -e "require('playwright').chromium.launch().then((b) => b.close())") >/dev/null 2>&1; then
            echo "Chromium starts: its libraries are already on this runner, skipping apt"
          else
            echo "Chromium cannot start yet: installing its libraries"
            pnpm --dir ui exec playwright install-deps chromium
          fi

      - name: UI — boot-order guard self-test (proves it still detects faults)
        if: steps.scope.outputs.ui == 'true'
        # Runs against perturbed COPIES of the baselines, never the committed
        # ones. The guard's whole value is catching a reorder that leaves the
        # event set and count identical — a guard only ever seen to pass cannot
        # show it still does that. Same argument as check-manifest.selftest.sh.
        #
        # BOTH baselines: cold (no backend) and stubbed (first-run install). The
        # stubbed one is what covers the wizard, and a fault-detector proven only
        # against the cold path would say nothing about that half.
        run: |
          echo "UI — boot-order guard self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-boot-order.selftest.sh cold
          bash scripts/check-boot-order.selftest.sh stubbed

      - name: UI — boot order (startup sequence unchanged)
        if: steps.scope.outputs.ui == 'true'
        # The listener-set diff proves WHICH listeners attach and is blind to
        # ORDER, which is where bootstrap correctness actually lives. Moving one
        # .vue import from one line of a feature module's import list to the next
        # shifted eight bootstrap events past the wizard's wiring — same count,
        # same listener set, nothing else saw it.
        #
        # This matters most while legacy.js is being retired: that file runs its
        # blocks in source order, so every extraction can reorder side effects.
        # If this reddens on a PR that did not mean to touch startup, the diff is
        # the finding — re-record only when the change is intended.
        run: |
          echo "UI — boot order (startup sequence unchanged)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-boot-order.sh

      - name: UI — role-matrix guard self-test (proves it still detects faults)
        if: steps.scope.outputs.ui == 'true'
        # Strips `hidden` off the gated controls on a timer, which is what a
        # removed or skipped gate looks like from outside, and requires the guard
        # to reject it — then requires it to accept the unperturbed build, so a
        # guard that is simply always-red cannot pass this step.
        run: |
          echo "UI — role-matrix guard self-test (proves it still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-role-matrix.sh --selftest

      - name: UI — role matrix (no control offered to someone who can't use it)
        if: steps.scope.outputs.ui == 'true'
        # Three privilege-leak bugs shipped here in a row and NONE was visible
        # from the source: twelve Settings sections that set `hidden` and
        # rendered anyway (an author `display:flex` beats the UA `[hidden]`
        # rule); three "+ New …" buttons with no gate at all; and a first fix
        # that gated inside a render which is skipped on an install with zero
        # rooms, hiding the button from the OWNER.
        #
        # So this asserts the RENDERED result in a browser, for three personas,
        # in both directions — what must be hidden and what must be visible.
        # Only checking the hidden half would pass a build where nothing renders.
        # The scoped-admin persona is the load-bearing one: it is the only thing
        # that distinguishes "gated on owner" from "gated on any admin".
        run: |
          echo "UI — role matrix (no control offered to someone who can't use it)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-role-matrix.sh

      - name: UI — first-open self-test (proves the probe still detects faults)
        if: steps.scope.outputs.ui == 'true'
        # Puts the unguarded join send back into the built bundle and requires
        # the probe to go red. Without this the probe could quietly stop
        # exercising the resume window and still report green forever.
        run: |
          echo "UI — first-open self-test (proves the probe still detects faults)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-first-open.sh --selftest

      - name: UI — first open (a room tapped on a connecting socket still opens)
        if: steps.scope.outputs.ui == 'true'
        # Field report: the first room tapped after opening the app did not
        # open, and tapping another room then tapping back "fixed" it. Cause was
        # `state.ws?.send(...)` in joinRoom — `?.` guards a null socket, not a
        # CONNECTING one, and send() on a connecting socket throws, which killed
        # the rest of the function (room name, composer, thread list, lastRoom).
        #
        # Only reachable on RESUME: rooms are painted from the WS `rooms`
        # message, so a cold load has nothing to click until the socket is open.
        # A plain load-and-click test would never catch this.
        run: |
          echo "UI — first open (a room tapped on a connecting socket still opens)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-first-open.sh

      - name: UI — wiring-remount self-test (proves the probe still detects it)
        if: steps.scope.outputs.ui == 'true'
        # Restores the shipped bug — the placeholder written into the island's
        # mount host unconditionally — and requires the probe to go red.
        run: |
          echo "UI — wiring-remount self-test (proves the probe still detects it)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-wiring-remount.sh --selftest

      - name: UI — wiring view survives a second render
        if: steps.scope.outputs.ui == 'true'
        # Field report: Wiring sat on "Loading…" forever. #matrix-canvas is both
        # the placeholder target and the island's mount host, so the placeholder
        # wiped the mounted DOM while mountMatrix() refused to rebuild. First
        # render fine, every one after it dead until a reload.
        #
        # A mount-host collision, not a data problem: /api/topology answered in
        # 2ms with correct JSON throughout, which is why nothing was red and a
        # first look at the view works. Drives all three entrances — first open,
        # Refresh, and close + reopen.
        run: |
          echo "UI — wiring view survives a second render" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-wiring-remount.sh

      - name: UI — turn-traces self-test (proves the probe still detects it)
        if: steps.scope.outputs.ui == 'true'
        # Drops the history has_trace flag from a scratch copy of the bundle and
        # requires the probe to go red.
        run: |
          echo "UI — turn-traces self-test (proves the probe still detects it)" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-turn-traces.sh --selftest

      - name: UI — a reply's Thoughts load on demand, the same live and stored
        if: steps.scope.outputs.ui == 'true'
        # History must flag a stored trace without fetching it; the first open
        # fetches it once; the live bubble and its reply render one view.
        run: |
          echo "UI — a reply's Thoughts load on demand, the same live and stored" > "$RUNNER_TEMP/ci-step"
          bash scripts/check-turn-traces.sh

      - name: UI — bundle-drift guard (committed bundle == fresh build)
        if: steps.scope.outputs.ui == 'true'
        run: |
          echo "UI — bundle-drift guard (committed bundle == fresh build)" > "$RUNNER_TEMP/ci-step"
          # `git status --porcelain`, not `git diff`: diff only reports TRACKED
          # files, so a build that emits a NEW file would slip through silently.
          # status covers modified and untracked alike.
          DRIFT=$(git status --porcelain -- app/public/webchat/)
          if [ -n "$DRIFT" ]; then
            echo "::error::app/public/webchat/ differs from a fresh 'pnpm --dir ui run build':"
            printf '%s\n' "$DRIFT"
            git diff -- app/public/webchat/ | head -50
            echo "::error::Edit ui/src/, rebuild, and commit the regenerated bundle."
            exit 1
          fi

      - name: Say what this run skipped
        # The UI self-tests are not gated on guard changes like compose's are:
        # several plant their fault inside the built bundle, so a UI change can
        # break them. Running beside compose, they add no wall time.
        if: steps.scope.outputs.ui != 'true'
        run: |
          echo "Say what this run skipped" > "$RUNNER_TEMP/ci-step"
          echo "::notice::UI phase SKIPPED — this change touches neither ui/ nor app/public/webchat/. The committed bundle was composed as-is; the bundle-drift guard and the browser probes did not run."

      - name: Name the failing step in a PR comment
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-report-failure.sh ui
