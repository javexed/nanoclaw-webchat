name: Compose

# The product gate: compose a full nanoclaw+webchat tree from this repo's
# app/patches against the pinned base + seam, run BOTH suites in the
# composed tree, and publish the composed tarball as the build artifact —
# the same artifact a release attaches for the Proxmox / deploy flows.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      # Anonymous checkout: this server 401s task-token git auth for repos
      # under this owner (the literal `forgejo` username appears to collide
      # with the internal actions identity), while the same mechanism works
      # for other owners. The repo is public, so fetch without credentials.
      - name: checkout (anonymous)
        run: |
          git init -q .
          git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
          git fetch -q --depth 1 origin ${{ github.sha }}
          git checkout -q FETCH_HEAD
      # See nanoclaw-dev's ci.yml for why there is no actions/setup-node here
      # (it breaks on Forgejo Actions; the runner image ships a current Node).
      - uses: pnpm/action-setup@v4
        with:
          # This repo has no package.json for the action to infer from — the
          # composed TREE is what pnpm operates on. Keep in step with the
          # base's packageManager field.
          version: 10.33.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Compose (clone base + seam, overlay, patch, register, build)
        env:
          # The seam lives on the same Forgejo instance this workflow runs on —
          # reach it via the server URL the runner already talks to, not the
          # tailnet hostname in versions.json (containers lack tailnet DNS).
          NANOCLAW_WEBCHAT_SEAM_REPO: ${{ github.server_url }}/nanoClaw/nanoclaw-dev.git
          SKIP_CONTAINER_BUILD: '1'
        run: bash install.sh --dir "$RUNNER_TEMP/composed"

      - name: Coverage guard (every fork-drift file accounted)
        env:
          SEAM_REPO: ${{ github.server_url }}/nanoClaw/nanoclaw-dev.git
        run: |
          # check-coverage.sh needs a git dir carrying both the seam ref and
          # the fork tip; the composed checkout already has base + seam —
          # fetch the fork branch into it.
          FORK_REF=$(python3 -c "import json;print(json.load(open('versions.json'))['nanoclaw']['forkRef'])")
          SEAM_REF=$(python3 -c "import json;print(json.load(open('versions.json'))['nanoclaw']['seamH5Ref'])")
          UPSTREAM_REF=$(python3 -c "import json;print(json.load(open('versions.json'))['nanoclaw']['upstreamRef'])")
          # This server refuses raw-SHA wants ("not our ref") — fetch the
          # branch the pin lives on, then assert the pinned commit arrived.
          git -C "$RUNNER_TEMP/composed" fetch -q nanoclaw-webchat-seam channels-webchat
          git -C "$RUNNER_TEMP/composed" cat-file -e "$FORK_REF" || {
            echo "pinned forkRef $FORK_REF not reachable from channels-webchat" >&2; exit 1; }
          bash scripts/check-coverage.sh "$RUNNER_TEMP/composed" "$SEAM_REF" "$FORK_REF" "$UPSTREAM_REF" 

      - name: Host tests (composed tree)
        working-directory: ${{ runner.temp }}/composed
        run: pnpm exec vitest run

      - name: Container typecheck + tests (composed tree)
        working-directory: ${{ runner.temp }}/composed/container/agent-runner
        run: |
          # Plain install (not --frozen-lockfile): the composed tree carries
          # upstream's bun.lock while the app tree adds runner sources; the
          # proven local compose flow installs the same way.
          bun install
          bun run typecheck
          bun test

      - name: Pack composed tarball
        run: |
          cd "$RUNNER_TEMP"
          # Ship sources, not installs: node_modules re-materialize from the
          # lockfile on the target; .git stays out of release artifacts.
          tar --exclude='./composed/node_modules' \
              --exclude='./composed/container/agent-runner/node_modules' \
              --exclude='./composed/.git' \
              -czf nanoclaw-webchat-composed.tar.gz ./composed
          ls -lh nanoclaw-webchat-composed.tar.gz

      - uses: actions/upload-artifact@v3
        with:
          name: nanoclaw-webchat-composed
          path: ${{ runner.temp }}/nanoclaw-webchat-composed.tar.gz
          retention-days: 14
